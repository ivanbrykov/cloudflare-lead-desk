name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build, and deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated template tooling
        run: pnpm --dir templates/cloudflare install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Protect migration history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run check:migrations

      - name: Build
        run: pnpm run build

      - name: Deploy dry-run
        run: pnpm exec wrangler deploy --dry-run

      - name: Source distribution contract tests
        run: pnpm run test:source

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Template install and persistent D1 upgrade
        run: pnpm run test:distribution

      - name: Build this commit through the source distribution contract
        run: pnpm run source:build .source-build

      - name: Preserve source-build receipt
        uses: actions/upload-artifact@v4
        with:
          name: lead-desk-source-build
          include-hidden-files: true
          path: |
            .source-build/source.json
          if-no-files-found: error
