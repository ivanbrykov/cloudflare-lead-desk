name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_api_smoke:
        description: Test draft creation and asset uploads with the CI token, without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build, and deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated template tooling
        run: pnpm --dir templates/cloudflare install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build

      - name: Deploy dry-run
        run: pnpm exec wrangler deploy --dry-run

      - name: Release contract tests
        run: pnpm run test:release

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Template install and persistent D1 upgrade
        run: pnpm run test:distribution

      - name: Package this commit
        env:
          RELEASE_VERSION: 0.1.0-main.${{ github.run_number }}.${{ github.run_attempt }}
        run: pnpm run release:build .release "$RELEASE_VERSION"

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lead-desk-release
          include-hidden-files: true
          path: |
            .release/lead-desk.tgz
            .release/lead-desk.json
          if-no-files-found: error

  publish:
    name: Publish tested main package
    needs: verify
    if: >-
      github.repository == 'ivanbrykov/cloudflare-lead-desk' &&
      github.ref == 'refs/heads/main' &&
      !inputs.release_api_smoke &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: lead-desk-release-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: lead-desk-release
          path: .release
      - name: Publish without rewriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs .release

  release-api-smoke:
    name: Test disposable draft and release assets
    needs: verify
    if: >-
      github.repository == 'ivanbrykov/cloudflare-lead-desk' &&
      github.event_name == 'workflow_dispatch' && inputs.release_api_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: lead-desk-release-api-smoke
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: lead-desk-release
          path: .release
      - name: Create, upload, verify, and remove disposable draft
        env:
          GH_TOKEN: ${{ github.token }}
          LEAD_DESK_RELEASE_API_SMOKE: 'true'
        run: node scripts/release/live.mjs .release
