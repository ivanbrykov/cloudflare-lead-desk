name: Upgrade Lead Desk

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-desk-upgrade-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve trusted upgrade inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      default_branch: ${{ steps.resolve.outputs.default_branch }}
      repository: ${{ steps.resolve.outputs.repository }}
      old_revision: ${{ steps.resolve.outputs.old_revision }}
      target_revision: ${{ steps.resolve.outputs.target_revision }}
    steps:
      - name: Checkout the installation default branch without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0

      - name: Resolve immutable source and installation state
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INSTALLATION_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { appendFile, readFile } from "node:fs/promises";
          import process from "node:process";

          const shaPattern = /^[a-f0-9]{40}$/u;
          const repositoryPattern = /^[\w.-]+\/[\w.-]+$/u;
          const defaultBranch = process.env.DEFAULT_BRANCH;
          const installationRepository = process.env.INSTALLATION_REPOSITORY;
          assert(defaultBranch, "Missing default branch");
          assert(
            repositoryPattern.test(installationRepository),
            "Invalid installation repository",
          );
          execFileSync("git", ["check-ref-format", "--branch", defaultBranch], {
            stdio: "ignore",
          });

          const configuration = JSON.parse(
            await readFile("lead-desk.json", "utf8"),
          );
          assert.deepEqual(
            Object.keys(configuration).toSorted(),
            ["repository", "revision"],
            "lead-desk.json has unexpected fields",
          );
          assert(
            repositoryPattern.test(configuration.repository),
            "Invalid upstream repository",
          );
          assert(
            shaPattern.test(configuration.revision),
            "Invalid current source revision",
          );
          assert.notEqual(
            configuration.repository,
            installationRepository,
            "Refusing to update the upstream source repository",
          );

          const baseSha = execFileSync("git", ["rev-parse", "HEAD"], {
            encoding: "utf8",
          }).trim();
          assert(shaPattern.test(baseSha), "Invalid installation base SHA");

          const remote = execFileSync(
            "git",
            [
              "-c",
              "credential.helper=",
              "-c",
              "http.https://github.com/.extraheader=",
              "ls-remote",
              "--exit-code",
              `https://github.com/${configuration.repository}.git`,
              "refs/heads/main",
            ],
            {
              encoding: "utf8",
              env: {
                HOME: process.env.RUNNER_TEMP,
                PATH: process.env.PATH,
                GIT_CONFIG_NOSYSTEM: "1",
                GIT_CONFIG_GLOBAL: "/dev/null",
                GIT_CONFIG_SYSTEM: "/dev/null",
              },
              timeout: 60_000,
            },
          ).trim();
          const match = /^([a-f0-9]{40})\trefs\/heads\/main$/u.exec(remote);
          assert(match, "Upstream main did not resolve to exactly one commit");

          await appendFile(
            process.env.GITHUB_OUTPUT,
            [
              `base_sha=${baseSha}`,
              `default_branch=${defaultBranch}`,
              `repository=${configuration.repository}`,
              `old_revision=${configuration.revision}`,
              `target_revision=${match[1]}`,
              "",
            ].join("\n"),
          );
          await appendFile(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Lead Desk upgrade",
              "",
              `- Previous source: \`${configuration.revision}\``,
              `- Candidate source: \`${match[1]}\``,
              `- Pin change required: ${configuration.revision === match[1] ? "no" : "yes"}`,
              "",
            ].join("\n"),
          );
          NODE

  validate:
    name: Validate candidate without write credentials
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the resolved installation commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base_sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5

      - name: Install installation tooling
        run: pnpm install --frozen-lockfile

      - name: Compile and validate the resolved candidate
        env:
          LEAD_DESK_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          LEAD_DESK_OLD_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          LEAD_DESK_OLD_REVISION: ${{ needs.resolve.outputs.old_revision }}
          LEAD_DESK_TARGET_REVISION: ${{ needs.resolve.outputs.target_revision }}
        run: node scripts/upgrade.mjs

  commit:
    name: Commit only the validated source pin
    needs:
      - resolve
      - validate
    if: needs.resolve.outputs.old_revision != needs.resolve.outputs.target_revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Reconstruct and push one pin-only commit
        shell: bash
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ needs.resolve.outputs.default_branch }}
          INSTALLATION_REPOSITORY: ${{ github.repository }}
          OLD_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          OLD_REVISION: ${{ needs.resolve.outputs.old_revision }}
          REPOSITORY_WRITE_TOKEN: ${{ github.token }}
          TARGET_REVISION: ${{ needs.resolve.outputs.target_revision }}
        run: |
          set -euo pipefail

          sha_pattern='^[a-f0-9]{40}$'
          repository_pattern='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          [[ "$BASE_SHA" =~ $sha_pattern ]]
          [[ "$OLD_REVISION" =~ $sha_pattern ]]
          [[ "$TARGET_REVISION" =~ $sha_pattern ]]
          [[ "$INSTALLATION_REPOSITORY" =~ $repository_pattern ]]
          [[ "$OLD_REPOSITORY" =~ $repository_pattern ]]
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null

          work_directory="$(mktemp -d)"
          cleanup() {
            unset GIT_CONFIG_VALUE_3 REPOSITORY_WRITE_TOKEN basic_auth
            rm -rf -- "$work_directory"
          }
          trap cleanup EXIT
          mkdir "$work_directory/home" "$work_directory/repository"
          export HOME="$work_directory/home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null

          cd "$work_directory/repository"
          git init --quiet
          git remote add origin "https://github.com/${INSTALLATION_REPOSITORY}.git"

          basic_auth="$(printf 'x-access-token:%s' "$REPOSITORY_WRITE_TOKEN" | base64 | tr -d '\n')"
          unset REPOSITORY_WRITE_TOKEN
          export GIT_CONFIG_COUNT=6
          export GIT_CONFIG_KEY_0=core.hooksPath
          export GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=credential.helper
          export GIT_CONFIG_VALUE_1=
          export GIT_CONFIG_KEY_2=protocol.file.allow
          export GIT_CONFIG_VALUE_2=never
          export GIT_CONFIG_KEY_3=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_3="AUTHORIZATION: basic ${basic_auth}"
          export GIT_CONFIG_KEY_4=maintenance.auto
          export GIT_CONFIG_VALUE_4=false
          export GIT_CONFIG_KEY_5=gc.auto
          export GIT_CONFIG_VALUE_5=0

          git fetch --no-auto-maintenance --quiet --depth=1 origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          fetched_base="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          [[ "$fetched_base" == "$BASE_SHA" ]]

          git show "${BASE_SHA}:lead-desk.json" > "$work_directory/original.json"
          original_entry="$(git ls-tree "$BASE_SHA" -- lead-desk.json)"
          [[ "$original_entry" =~ ^100644[[:space:]]blob[[:space:]][a-f0-9]{40}[[:space:]]lead-desk\.json$ ]]

          export ORIGINAL_CONFIG_PATH="$work_directory/original.json"
          export NEXT_CONFIG_PATH="$work_directory/next.json"
          export OLD_REPOSITORY OLD_REVISION TARGET_REVISION
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile, writeFile } from "node:fs/promises";
          import process from "node:process";

          const shaPattern = /^[a-f0-9]{40}$/u;
          const repositoryPattern = /^[\w.-]+\/[\w.-]+$/u;
          assert(repositoryPattern.test(process.env.OLD_REPOSITORY));
          assert(shaPattern.test(process.env.OLD_REVISION));
          assert(shaPattern.test(process.env.TARGET_REVISION));

          const configuration = JSON.parse(
            await readFile(process.env.ORIGINAL_CONFIG_PATH, "utf8"),
          );
          assert.deepEqual(
            Object.keys(configuration).toSorted(),
            ["repository", "revision"],
            "lead-desk.json has unexpected fields",
          );
          assert.equal(configuration.repository, process.env.OLD_REPOSITORY);
          assert.equal(configuration.revision, process.env.OLD_REVISION);
          await writeFile(
            process.env.NEXT_CONFIG_PATH,
            `${JSON.stringify({
              repository: configuration.repository,
              revision: process.env.TARGET_REVISION,
            }, undefined, 2)}\n`,
          );
          NODE

          git read-tree "${BASE_SHA}^{tree}"
          next_blob="$(git hash-object -w "$work_directory/next.json")"
          git update-index --add --cacheinfo "100644,${next_blob},lead-desk.json"
          next_tree="$(git write-tree)"
          base_tree="$(git rev-parse "${BASE_SHA}^{tree}")"
          [[ "$next_tree" != "$base_tree" ]]

          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          next_commit="$(
            printf '%s\n' 'chore: upgrade Lead Desk source' |
              git commit-tree "$next_tree" -p "$BASE_SHA"
          )"
          changed_paths="$(git diff-tree --no-commit-id --name-only -r "$next_commit")"
          [[ "$changed_paths" == 'lead-desk.json' ]]

          remote_line="$(git ls-remote --exit-code origin "refs/heads/${DEFAULT_BRANCH}")"
          remote_head="${remote_line%%$'\t'*}"
          [[ "$remote_head" == "$BASE_SHA" ]]
          git push --porcelain origin "${next_commit}:refs/heads/${DEFAULT_BRANCH}"

          printf '%s\n' "- Committed source pin: \`${TARGET_REVISION}\`" >> "$GITHUB_STEP_SUMMARY"
